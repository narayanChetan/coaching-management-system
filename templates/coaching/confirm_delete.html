{% extends 'base.html' %}
{% block title %}Confirm Delete{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Confirm Delete</h1>
</div>

<div class="card form-card">
    <p class="confirm-text">Are you sure you want to delete <strong>{{ object }}</strong>? This action cannot be undone.</p>
    <form method="post">
        {% csrf_token %}
        <div class="form-actions">
            <button type="submit" class="btn btn-delete">Yes, Delete</button>
            <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
