{% extends 'base.html' %}
{% block title %}Login - Coaching Management System{% endblock %}

{% block auth_content %}
<div class="login-page">
    <div class="login-card">
        <h1 class="login-title">Coaching Manager</h1>
        <p class="login-subtitle">Sign in to manage your coaching institute</p>

        {% if form.errors %}
        <div class="alert alert-error">Invalid username or password. Please try again.</div>
        {% endif %}

        <form method="post" class="login-form" novalidate>
            {% csrf_token %}
            <div class="form-group">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-control" required autofocus>
            </div>
            <div class="form-group">
                <label for="id_password">Password</label>
                <input type="password" name="password" id="id_password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Login</button>
            <input type="hidden" name="next" value="{{ next }}">
        </form>
    </div>
</div>
{% endblock %}
